# Foot terminal configuration

[main]
font=Hack:size=10.5, Noto Color Emoji:size=10.5
dpi-aware=no
pad=8x6 center
resize-by-cells=no
resize-keep-grid=no
resize-delay-ms=0
box-drawings-uses-font-glyphs=no
bold-text-in-bright=palette-based
selection-target=both

[scrollback]
lines=10000
multiplier=3.0
indicator-position=relative

[url]
launch=xdg-open ${url}
style=dotted
osc8-underline=always

[cursor]
style=beam
unfocused-style=hollow
blink=yes

[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

[colors-dark]
background=08111f
foreground=eef2f6

# ANSI palette: dark, red, green, yellow, blue, magenta, cyan, white
regular0=08111f
regular1=b94747
regular2=5f9c83
regular3=d6ae4a
regular4=4c83c3
regular5=9a78b4
regular6=79afc7
regular7=a8b4c3

bright0=27374a
bright1=d66a6a
bright2=7db99f
bright3=e7c766
bright4=72a2d6
bright5=b49ac9
bright6=9ac8d9
bright7=eef2f6

selection-foreground=eef2f6
selection-background=17283d
cursor=08111f d6ae4a
jump-labels=08111f d6ae4a
scrollback-indicator=08111f 79afc7
search-box-no-match=eef2f6 b94747
search-box-match=08111f d6ae4a
urls=79afc7

[bell]
system=no
urgent=yes
notify=no
visual=no
