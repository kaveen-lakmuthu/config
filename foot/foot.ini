# Foot terminal configuration

[main]
include=~/.config/river-control-center/generated/foot-theme.ini
font=Hack:size=10.5, Noto Color Emoji:size=10.5
dpi-aware=no
pad=8x6 center
resize-by-cells=no
resize-keep-grid=no
resize-delay-ms=0
box-drawings-uses-font-glyphs=no
bold-text-in-bright=palette-based
selection-target=both

[scrollback]
lines=10000
multiplier=3.0
indicator-position=relative

[url]
launch=xdg-open ${url}
style=dotted
osc8-underline=always

[cursor]
style=beam
unfocused-style=hollow
blink=yes

[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

[bell]
system=no
urgent=yes
notify=no
visual=no
