# -----------------------------------------------------------------------------
# Terminal and input
# -----------------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -as terminal-features ",foot:RGB:clipboard:ccolour:cstyle:extkeys:focus:hyperlinks:title"
set -s extended-keys on
set -s focus-events on
set -s escape-time 10

set -g mouse on
set -g history-limit 50000
set -g display-time 2000
set -g repeat-time 500
set -g status-keys vi
setw -g mode-keys vi

# Let copy mode write to Wayland, while preventing applications from requesting
# the host clipboard through tmux.
set -s copy-command "wl-copy"
set -s set-clipboard on
set -s get-clipboard off

# -----------------------------------------------------------------------------
# Sessions, windows, and panes
# -----------------------------------------------------------------------------

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

setw -g automatic-rename on
setw -g automatic-rename-format "#{pane_current_command}"
setw -g allow-rename off

set -g set-titles on
set -g set-titles-string "tmux: #S / #W"

# Refresh desktop and agent variables whenever a client attaches. This keeps
# Wayland clipboard access and SSH authentication working across new logins.
set -g update-environment "DISPLAY WAYLAND_DISPLAY XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS SSH_AUTH_SOCK SSH_AGENT_PID"

# New windows and splits inherit the active pane's working directory.
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-like pane movement and repeatable resizing (after the default Ctrl-b).
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 5

# h/j/k/l replaces tmux's default Prefix+l binding; keep a quick last-window
# toggle on Prefix+Tab.
bind Tab last-window

# A temporary shell in the current directory; exiting closes the popup.
bind g display-popup -E -w 85% -h 85% -d "#{pane_current_path}"

# FZF session switcher. Lowercase f retains tmux's built-in window search.
bind F display-popup -E -w 70% -h 60% /home/kaveen/.config/tmux/scripts/session-switcher

# Toggle sending the same input to every pane in the current window.
bind S set-window-option synchronize-panes \; display-message "Pane synchronization: #{?pane_synchronized,on,off}"

# Reload this file without restarting tmux.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux configuration reloaded"

# -----------------------------------------------------------------------------
# Copy mode and Wayland clipboard
# -----------------------------------------------------------------------------

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# -----------------------------------------------------------------------------
# Appearance — River dark blue / gold palette
# -----------------------------------------------------------------------------

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 80
set -g status-style "bg=#101C2C,fg=#EEF2F6"

set -g status-left "#[bg=#D6AE4A,fg=#08111F,bold] #S #[default] "
set -g status-right "#{?client_prefix,#[bg=#B94747,fg=#EEF2F6,bold] PREFIX ,}#{?pane_in_mode,#[bg=#4C83C3,fg=#EEF2F6,bold] COPY ,}#{?window_zoomed_flag,#[bg=#79AFC7,fg=#08111F,bold] ZOOM ,}#{?pane_synchronized,#[bg=#B94747,fg=#EEF2F6,bold] SYNC ,}#[bg=#101C2C,fg=#A8B4C3]#{b:pane_current_path}  #[fg=#D6AE4A,bold]%H:%M "

setw -g window-status-separator ""
setw -g window-status-format "#[bg=#101C2C,fg=#A8B4C3] #I:#W#F "
setw -g window-status-current-format "#[bg=#D6AE4A,fg=#08111F,bold] #I:#W#F "
setw -g window-status-activity-style "bg=#4C83C3,fg=#EEF2F6,bold"
setw -g window-status-bell-style "bg=#B94747,fg=#EEF2F6,bold"

set -g pane-border-lines single
set -g pane-border-style "fg=#27374A"
set -g pane-active-border-style "fg=#D6AE4A"
set -g pane-scrollbars modal
set -g pane-scrollbars-position right
set -g pane-scrollbars-style "fg=#4C83C3,bg=#101C2C"

set -g mode-style "bg=#D6AE4A,fg=#08111F,bold"
set -g message-style "bg=#D6AE4A,fg=#08111F,bold"
set -g message-command-style "bg=#17283D,fg=#EEF2F6"
set -g clock-mode-colour "#D6AE4A"
set -g display-panes-colour "#4C83C3"
set -g display-panes-active-colour "#D6AE4A"
set -g copy-mode-match-style "bg=#4C83C3,fg=#EEF2F6"
set -g copy-mode-current-match-style "bg=#D6AE4A,fg=#08111F,bold"
set -g popup-style "bg=#101C2C,fg=#EEF2F6"
set -g popup-border-style "fg=#D6AE4A"
set -g popup-border-lines rounded

setw -g monitor-activity on
set -g activity-action other
set -g visual-activity off
set -g visual-bell off
